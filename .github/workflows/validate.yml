name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade -r requirements_test.txt

      - name: Run complete test suite with coverage
        run: >-
          python -m pytest tests -v
          --cov=custom_components.leeventus_ir
          --cov-report=term-missing
          --cov-fail-under=95

      - name: Run protocol tests
        run: python -m unittest discover -s tests -v

  native-infrared-api:
    name: Native infrared API (latest Home Assistant)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install latest Home Assistant and native infrared dependency
        run: python -m pip install --upgrade homeassistant infrared-protocols

      - name: Import integration against the native infrared API
        run: >-
          python -c
          "import custom_components.leeventus_ir;
          import custom_components.leeventus_ir.event;
          import custom_components.leeventus_ir.ir_command"

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check .

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
