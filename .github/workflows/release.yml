name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade -r requirements_test.txt

      - name: Require tag and manifest versions to match
        run: >-
          python -c
          "import json, pathlib, sys;
          manifest=json.loads(pathlib.Path('custom_components/leeventus_ir/manifest.json').read_text());
          tag=sys.argv[1];
          raise SystemExit(0 if tag == 'v' + manifest['version'] else
          f'{tag} does not match manifest version {manifest[\"version\"]}')"
          "${{ github.ref_name }}"

      - name: Run complete test suite with coverage
        run: >-
          python -m pytest tests -v
          --cov=custom_components.leeventus_ir
          --cov-report=term-missing
          --cov-fail-under=95

      - name: Run Ruff
        run: python -m ruff check .

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

  release:
    name: Create GitHub release
    needs:
      - validate
      - hassfest
      - hacs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          --verify-tag
          --generate-notes
          --title "Leeventus IR ${{ github.ref_name }}"
